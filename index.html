<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>NIVEL ARENA レベルカウンター</title>
<style>
  :root {
    --bg: #0b1020;
    --u: min(1vw, 0.6vh);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; width: 100%; height: 100%; background: var(--bg); color: #fff;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    overflow: hidden; touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }
  main {
    display: grid; grid-template-rows: 1fr auto 1fr;
    width: 100%; height: 100dvh; max-width: 100vw;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .zone {
    position: relative; overflow: hidden; min-height: 0; min-width: 0;
    background: linear-gradient(160deg, var(--c-main), #0b1020 70%);
    transition: background .25s;
  }
  .zone[data-color="default1"] { --c-main: #1e3a8a; --c-pip: #60a5fa; --c-sw: #2563eb; }
  .zone[data-color="default2"] { --c-main: #7f1d1d; --c-pip: #f87171; --c-sw: #dc2626; }
  .zone[data-color="red"]    { --c-main: #991b1b; --c-pip: #f87171; --c-sw: #dc2626; }
  .zone[data-color="blue"]   { --c-main: #1d4ed8; --c-pip: #93c5fd; --c-sw: #2563eb; }
  .zone[data-color="yellow"] { --c-main: #a16207; --c-pip: #fde047; --c-sw: #eab308; }
  .zone[data-color="purple"] { --c-main: #6b21a8; --c-pip: #d8b4fe; --c-sw: #9333ea; }
  .zone[data-color="green"]  { --c-main: #166534; --c-pip: #86efac; --c-sw: #16a34a; }

  .player {
    position: absolute; top: 50%; left: 50%;
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: calc(var(--u) * 2); padding: 4px 8px;
    transform: translate(-50%, -50%) rotate(0deg);
  }
  body[data-mode="face"] .zone.p2 .player {
    transform: translate(-50%, -50%) rotate(180deg);
  }
  body[data-mode="side"] .player {
    width: var(--zone-h); height: var(--zone-w);
    transform: translate(-50%, -50%) rotate(-90deg);
    --u: min(var(--zone-h) / 100, var(--zone-w) / 60);
  }

  /* 名前 + 色ボタンのヘッダー行 */
  .head { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 3); }
  .name { font-size: calc(var(--u) * 3.5); letter-spacing: .2em; opacity: .75; }
  .level-label { font-size: calc(var(--u) * 3); letter-spacing: .3em; opacity: .6; }

  /* 色選択: トグルボタン + 展開するスウォッチ */
  .picker { display: flex; align-items: center; gap: calc(var(--u) * 2); }
  .toggle {
    width: calc(var(--u) * 8); height: calc(var(--u) * 8);
    min-width: 30px; min-height: 30px;
    border-radius: 50%; padding: 0; cursor: pointer;
    background: var(--c-sw);
    border: 2px solid #fff;
    box-shadow: 0 0 0 3px rgba(255,255,255,.25);
    position: relative;
  }
  /* 「色を選べる」ことを示す小さなリング */
  .toggle::after {
    content: ""; position: absolute; inset: 22%;
    border-radius: 50%; border: 2px dashed rgba(255,255,255,.85);
  }
  .toggle:active { transform: scale(.92); }

  .swatches {
    display: flex; gap: calc(var(--u) * 2.5);
    max-width: 0; opacity: 0; overflow: hidden;
    transition: max-width .3s ease, opacity .2s ease;
    padding: 4px 0;
  }
  .picker.open .swatches { max-width: 80vw; opacity: 1; overflow: visible; }
  .sw {
    width: calc(var(--u) * 8); height: calc(var(--u) * 8);
    min-width: 30px; min-height: 30px; flex: 0 0 auto;
    border-radius: 50%; border: 2px solid rgba(255,255,255,.35); padding: 0; cursor: pointer;
  }
  .sw[data-c="red"]    { background: #dc2626; }
  .sw[data-c="blue"]   { background: #2563eb; }
  .sw[data-c="yellow"] { background: #eab308; }
  .sw[data-c="purple"] { background: #9333ea; }
  .sw[data-c="green"]  { background: #16a34a; }
  .sw.sel { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.45); }
  .sw:active { transform: scale(.92); }

  .row {
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; justify-items: center;
    width: 100%; max-width: 100%; gap: calc(var(--u) * 2);
  }
  .num {
    font-size: calc(var(--u) * 38); font-weight: 800; line-height: 1;
    text-align: center; font-variant-numeric: tabular-nums;
    min-width: 1.2ch; transition: transform .12s;
  }
  .num.bump { transform: scale(1.12); }
  .num.max { color: #fde047; text-shadow: 0 0 24px rgba(253,224,71,.7); }
  .btn {
    width: calc(var(--u) * 24); height: calc(var(--u) * 24); max-width: 100%;
    border-radius: 50%; border: 0; color: #fff; font-size: calc(var(--u) * 12); font-weight: 700;
    background: rgba(255,255,255,.14); backdrop-filter: blur(4px);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.25);
    cursor: pointer; display: grid; place-items: center; padding: 0; line-height: 1;
  }
  .btn:active { background: rgba(255,255,255,.32); transform: scale(.94); }
  .btn:disabled { opacity: .25; }
  .pips { display: flex; gap: calc(var(--u) * 1.5); }
  .pip { width: calc(var(--u) * 3); height: calc(var(--u) * 3); border-radius: 50%; background: rgba(255,255,255,.18); }
  .pip.on { background: var(--c-pip); }

  .center {
    display: flex; justify-content: center; gap: 12px; padding: 6px;
    background: #000; border-top: 1px solid #333; border-bottom: 1px solid #333;
  }
  .center button {
    background: #1f2937; color: #e5e7eb; border: 1px solid #374151; border-radius: 8px;
    padding: 8px 16px; font-size: 14px; cursor: pointer;
  }
  .center button:active { background: #374151; }
</style>
</head>
<body data-mode="face">
<main>
  <section class="zone p2" id="z1" data-color="default2">
    <div class="player">
      <div class="head">
        <div class="name">PLAYER 2</div>
        <div class="picker" data-p="1">
          <button class="toggle" aria-label="P2 リーダー色を選ぶ"></button>
          <div class="swatches"></div>
        </div>
      </div>
      <div class="row">
        <button class="btn" data-p="1" data-d="-1" aria-label="P2 レベルダウン">−</button>
        <div class="num" id="n1">1</div>
        <button class="btn" data-p="1" data-d="1" aria-label="P2 レベルアップ">+</button>
      </div>
      <div class="pips" id="pips1"></div>
      <div class="level-label">LEVEL</div>
    </div>
  </section>

  <div class="center">
    <button id="mode">向き: 対面</button>
    <button id="reset">リセット</button>
  </div>

  <section class="zone p1" id="z0" data-color="default1">
    <div class="player">
      <div class="head">
        <div class="name">PLAYER 1</div>
        <div class="picker" data-p="0">
          <button class="toggle" aria-label="P1 リーダー色を選ぶ"></button>
          <div class="swatches"></div>
        </div>
      </div>
      <div class="row">
        <button class="btn" data-p="0" data-d="-1" aria-label="P1 レベルダウン">−</button>
        <div class="num" id="n0">1</div>
        <button class="btn" data-p="0" data-d="1" aria-label="P1 レベルアップ">+</button>
      </div>
      <div class="pips" id="pips0"></div>
      <div class="level-label">LEVEL</div>
    </div>
  </section>
</main>

<script>
(() => {
  const MAX = 10, MIN = 1;
  const KEY = "nivel-arena-levels", MODE_KEY = "nivel-arena-mode", COLOR_KEY = "nivel-arena-colors";
  const COLORS = [
    ["red", "赤"], ["blue", "青"], ["yellow", "黄"], ["purple", "紫"], ["green", "緑"]
  ];
  const DEFAULTS = ["default1", "default2"];
  let levels = [1, 1];
  let mode = "face";
  let colors = [...DEFAULTS];

  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (Array.isArray(saved) && saved.length === 2) {
      levels = saved.map(v => Math.min(MAX, Math.max(MIN, Number(v) || MIN)));
    }
    const m = localStorage.getItem(MODE_KEY);
    if (m === "face" || m === "side") mode = m;
    const c = JSON.parse(localStorage.getItem(COLOR_KEY));
    if (Array.isArray(c) && c.length === 2) {
      colors = c.map((v, i) => (COLORS.some(x => x[0] === v) ? v : DEFAULTS[i]));
    }
  } catch (e) {}

  const pickers = [0, 1].map(p => document.querySelector(`.picker[data-p="${p}"]`));

  function closeAll() { pickers.forEach(el => el.classList.remove("open")); }

  [0, 1].forEach(p => {
    // レベル目盛り
    const box = document.getElementById("pips" + p);
    for (let i = 1; i <= MAX; i++) {
      const s = document.createElement("span");
      s.className = "pip";
      box.appendChild(s);
    }
    // 色ボタン
    const picker = pickers[p];
    const sw = picker.querySelector(".swatches");
    COLORS.forEach(([key, label]) => {
      const b = document.createElement("button");
      b.className = "sw";
      b.dataset.c = key;
      b.setAttribute("aria-label", `P${p + 1} 背景色: ${label}`);
      b.addEventListener("click", e => {
        e.stopPropagation();
        colors[p] = key;
        applyColor(p);
        try { localStorage.setItem(COLOR_KEY, JSON.stringify(colors)); } catch (err) {}
        picker.classList.remove("open"); // 選んだら自動で畳む
      });
      sw.appendChild(b);
    });
    // トグル
    picker.querySelector(".toggle").addEventListener("click", e => {
      e.stopPropagation();
      const willOpen = !picker.classList.contains("open");
      closeAll();
      picker.classList.toggle("open", willOpen);
    });
  });

  // 画面の他の場所をタップしたら畳む
  document.addEventListener("click", closeAll);

  function applyColor(p) {
    document.getElementById("z" + p).dataset.color = colors[p];
    pickers[p].querySelectorAll(".sw").forEach(el => {
      el.classList.toggle("sel", el.dataset.c === colors[p]);
    });
  }

  function updateZoneSize() {
    const z = document.getElementById("z0");
    const root = document.documentElement.style;
    root.setProperty("--zone-w", z.clientWidth + "px");
    root.setProperty("--zone-h", z.clientHeight + "px");
  }

  function applyMode() {
    document.body.dataset.mode = mode;
    document.getElementById("mode").textContent =
      "向き: " + (mode === "face" ? "対面" : "横並び");
    updateZoneSize();
  }

  function render(p, bump) {
    const n = document.getElementById("n" + p);
    n.textContent = levels[p];
    n.classList.toggle("max", levels[p] === MAX);
    if (bump) {
      n.classList.add("bump");
      setTimeout(() => n.classList.remove("bump"), 120);
    }
    document.querySelectorAll("#pips" + p + " .pip").forEach((el, i) => {
      el.classList.toggle("on", i < levels[p]);
    });
    document.querySelector(`.btn[data-p="${p}"][data-d="1"]`).disabled = levels[p] >= MAX;
    document.querySelector(`.btn[data-p="${p}"][data-d="-1"]`).disabled = levels[p] <= MIN;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(levels)); } catch (e) {}
  }

  document.querySelectorAll(".btn").forEach(b => {
    b.addEventListener("click", () => {
      const p = Number(b.dataset.p), d = Number(b.dataset.d);
      const next = Math.min(MAX, Math.max(MIN, levels[p] + d));
      if (next === levels[p]) return;
      levels[p] = next;
      render(p, true);
      save();
      if (navigator.vibrate) navigator.vibrate(15);
    });
  });

  document.getElementById("mode").addEventListener("click", () => {
    mode = mode === "face" ? "side" : "face";
    try { localStorage.setItem(MODE_KEY, mode); } catch (e) {}
    applyMode();
  });

  // リセット: レベルのみ1に戻す(色・向きは維持)
  document.getElementById("reset").addEventListener("click", () => {
    if (!confirm("両プレイヤーのレベルを1に戻しますか?")) return;
    levels = [1, 1];
    render(0); render(1); save();
  });

  window.addEventListener("resize", updateZoneSize);
  window.addEventListener("orientationchange", () => setTimeout(updateZoneSize, 200));

  applyMode();
  [0, 1].forEach(p => { render(p); applyColor(p); });
})();
</script>
</body>
</html>
